kind = "web"
previewPath = "/"
title = "Telegram Gift Flow"
description = "A focused Telegram collectible resale flow: authorize a user account to discover seven live collectible listings, then review and explicitly confirm each bot-funded Stars purchase one at a time."
version = "1.0.0"
id = "artifacts/quick-fix-workspace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18991

[services.development]
run = "pnpm --filter @workspace/quick-fix-workspace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quick-fix-workspace", "run", "build" ]
serve = "static"
publicDir = "artifacts/quick-fix-workspace/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18991"
BASE_PATH = "/"
